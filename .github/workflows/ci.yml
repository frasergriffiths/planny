name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: |
          set -o pipefail
          bun test 2>&1 | tee /tmp/test.log
          grep -Eq '5 skip(ped)?' /tmp/test.log
      - run: bun run scripts/generate-tokens.ts --check
      - run: bun run scripts/generate-sample.ts --check

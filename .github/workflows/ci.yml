name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run mcp:typecheck
      - run: bun run build
      - run: bun test --isolate --concurrency=1
      - run: cd mcp && bun run build && bun run e2e
      - run: bun run scripts/generate-tokens.ts --check
      - run: bun run scripts/generate-sample.ts --check
      - run: bun run scripts/generate-skill-errors.ts --check
